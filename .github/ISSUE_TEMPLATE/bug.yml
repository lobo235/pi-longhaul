name: Bug report
description: Longhaul did something wrong, or a compaction fell back to pi's own.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a transcript, a raw log line, or your `longhaul.json` routes here.** They contain your
        conversations and your setup, and this issue is public. Security problems go to the Security tab
        instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: /longhaul-report output
      description: |
        Run `/longhaul-report` in pi, read the file it names, and paste it here. It holds versions, settings
        names and counts, not your messages. Remove anything you would rather not share.
      render: markdown
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model class
      description: The kind of model compacting, e.g. "hosted, reasoning off" or "local 27B". No need to name a provider.
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, ideally on a synthetic session. Optional.
