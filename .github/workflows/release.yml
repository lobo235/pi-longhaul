name: release

# Publishes to npm when a version tag is pushed. The publish job runs in the `npm` environment, which needs a
# maintainer's approval, and authenticates with npm trusted publishing (OIDC): no npm token is stored.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release per tag at a time, and never cancelled halfway through a publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # No npm cache on the release path: a cache entry saved by another run must not reach what is tested
          # and published.
          package-manager-cache: false
      - name: The tag matches package.json, and no placeholder is left
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then echo "tag $TAG does not match package.json version $version" >&2; exit 1; fi
          if grep -rn --include='*.md' --include='*.json' --include='*.yml' '/OWNER[/]pi-longhaul' . --exclude-dir=node_modules; then
            echo "replace the OWNER placeholder before releasing" >&2; exit 1
          fi
          grep -q "^## \[$TAG\]" CHANGELOG.md || { echo "CHANGELOG.md has no ## [$TAG] section" >&2; exit 1; }
          image="$(node -p "require('./package.json').pi?.image ?? ''")"
          case "$image" in */"$TAG"/*) ;; *) echo "package.json pi.image ($image) is not pinned to $TAG" >&2; exit 1 ;; esac
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run check-pack

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no npm token is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$npm_version" \
            || { echo "npm $npm_version is older than 11.5.1, which trusted publishing needs" >&2; exit 1; }
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac

  github-release:
    # After npm has the version, so a GitHub Release never names a version npm does not have.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the Release for the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GitHub Release from the tag's CHANGELOG.md section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" 'index($0, "## [" tag "]") == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no notes under ## [$TAG]" >&2; exit 1; }
          flags=(--verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md")
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}"
